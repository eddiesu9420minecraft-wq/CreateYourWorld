[package]
name = "cyw-core"
# Must equal the app version (src-tauri/Cargo.toml); `version_matches_app` checks it.
version = "0.1.3-alpha"
description = "Create Your World core: catalog, downloads, verification, install, update, PATH. No GUI."
authors = ["pikara"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
regex = "1"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
minisign-verify = "0.2"
base64 = "0.22"
anyhow = "1"
dirs = "7"
fs4 = { version = "0.13", features = ["sync"] }
pikara-secure = { path = "../pikara-secure" }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography"] }

[dev-dependencies]
