[package]
name = "cyw-cli"
# same version as Create Your World (the CLI ships inside the CYW installer)
version = "0.1.3-alpha"
description = "cyw — the Create Your World command line (no GUI, no WebView, no Node.js)"
authors = ["pikara"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "cyw"
path = "src/main.rs"

[dependencies]
cyw-core = { path = "../cyw-core" }
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
indicatif = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sys-locale = "0.3"
semver = "1"

[dev-dependencies]
tempfile = "3"
