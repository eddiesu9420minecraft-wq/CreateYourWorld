[package]
name = "create-your-world"
version = "0.1.0"
description = "Create Your World. — Pikara software hub. Free Forever."
authors = ["pikara"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cyw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
regex = "1"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
minisign-verify = "0.2"
base64 = "0.22"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
