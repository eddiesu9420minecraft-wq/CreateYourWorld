name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["update.json", "update.json.sig", "docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri\ncrates/pikara-secure" }
      - name: Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - name: pikara-secure (offline + live security tests)
        run: cargo test --manifest-path crates/pikara-secure/Cargo.toml --lib --test attacks -- --include-ignored --nocapture
      - name: CYW app tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
