name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["update.json", "update.json.sig", "docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri\ncrates/pikara-secure\ncrates/cyw-core\ncrates/cyw-cli" }
      - name: Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - name: pikara-secure (offline + live security tests)
        run: cargo test --manifest-path crates/pikara-secure/Cargo.toml --lib --test attacks -- --include-ignored --nocapture
      - name: cyw CLI sidecar (required by the app build)
        run: node tools/build-cyw-sidecar.mjs
      - name: Feedback backend tests (Worker in local workerd with D1/R2; unit, API, security)
        working-directory: services/feedback
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: cyw-core tests (lock, ids/migration, plugins, PATH, signed plugin index, feedback client)
        run: cargo test --manifest-path crates/cyw-core/Cargo.toml
      - name: cyw CLI tests (real binary, isolated data; network tests download from GitHub)
        env: { CYW_NET_TESTS: "1", GITHUB_TOKEN: "${{ github.token }}" }
        run: cargo test --manifest-path crates/cyw-cli/Cargo.toml
      - name: CYW app tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
